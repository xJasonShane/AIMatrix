name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # 构建前强制校验唯一数据文件（含真实 navigation.json 的有效性断言）
      - run: npm run validate:data
      - run: npm run build
      # 包体积守卫：JS gzip 超过预算（300 kB）即失败，防止依赖膨胀回归
      - run: npm run check:size
      # E2E smoke：以生产构建为被测对象，覆盖视图切换/命令面板/矩阵搜索关键路径
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
